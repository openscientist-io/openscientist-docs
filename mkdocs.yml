site_name: OpenScientist
site_description: Deployment, operations, and architecture docs for OpenScientist, an open-source agentic AI co-scientist for biomedical data analysis.
site_url: https://docs.openscientist.io/
repo_url: https://github.com/openscientist-io/openscientist
repo_name: openscientist-io/openscientist
edit_uri: ""
copyright: Copyright &copy; 2026
theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon-32.png
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      primary: custom
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
plugins:
  - search
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Deployment: deployment.md
  - Air-gapped mode: airgap.md
  - REST API: api.md
  - Architecture: architecture.md
  - Contributing: contributing.md
extra_css:
  - stylesheets/extra.css
