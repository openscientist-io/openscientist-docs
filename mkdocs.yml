site_name: OpenScientist
site_url: https://docs.openscientist.io/
repo_url: https://github.com/openscientist-io/openscientist
repo_name: openscientist-io/openscientist
edit_uri: ""
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
plugins:
  - search
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Deployment: deployment.md
  - Air-gapped mode: airgap.md
  - Architecture: architecture.md
  - Contributing: contributing.md
